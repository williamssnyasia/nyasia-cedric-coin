<title>Our Coin — Nyasia & Cedric</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 50% 35%,#3b2a1c,#100c09 72%);
  color:#f8df9c; font-family:Georgia,serif; overflow:hidden;
}
.wrap{width:min(94vw,430px);text-align:center}
h1{font-size:34px;margin:0 0 5px;letter-spacing:.4px}
.sub{font:700 12px system-ui;letter-spacing:3px;margin-bottom:22px;opacity:.85}
.scene{
  width:min(78vw,315px);height:min(78vw,315px);margin:0 auto 24px;
  perspective:1200px;cursor:pointer;touch-action:manipulation;
}
.coin{
  width:100%;height:100%;position:relative;transform-style:preserve-3d;
  transition:transform 1s cubic-bezier(.2,.8,.2,1);
}
.coin.flipped{transform:rotateY(180deg)}
.side{
  position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;
  padding:10px;border:9px solid #d09a35;
  background:linear-gradient(145deg,#ffe6a1,#b97818 46%,#f4c75d 72%,#8b5710);
  box-shadow:0 15px 35px #0009,inset 0 0 0 3px #ffe9ad,inset 0 0 0 7px #9a6517;
}
.back{transform:rotateY(180deg)}
.inner{
  width:100%;height:100%;border-radius:50%;overflow:hidden;
  border:3px solid #ffe9b0;position:relative;background:#222;
}
.inner img{width:100%;height:100%;object-fit:cover}
.label{
  position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
  padding:7px 18px;border-radius:999px;white-space:nowrap;
  background:#16100dcc;border:1px solid #ffe6a066;
  color:#ffe4a0;font:800 14px system-ui;letter-spacing:2px;
}
button{
  border:0;border-radius:999px;padding:16px 29px;
  background:linear-gradient(#f9d77e,#c58925);
  color:#26180a;font:bold 16px system-ui;letter-spacing:1px;
  box-shadow:0 8px 22px #0008;cursor:pointer;
}
button:active{transform:scale(.96)}
.hint{margin-top:13px;font:13px system-ui;opacity:.7}
</style>
</head>
